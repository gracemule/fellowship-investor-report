[project]
name = "chui-reporter"
version = "0.1.0"
description = "Quarterly LP report agent for Chui Ventures Fund I"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "pydantic>=2.9",
    "python-docx>=1.1.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "langgraph>=1.2.12,<2",
    "langchain-anthropic>=1.7.5",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-deepseek>=1.1.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chui_reporter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: invokes LibreOffice; deselect with -m 'not slow'"]
pythonpath = ["src"]
