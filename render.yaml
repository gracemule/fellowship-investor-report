# Render blueprint for the Chui Ventures reporter (the app: web interface + agent).
#
# The deployment is two free web services, each in its own Render workspace so that each gets its own 750 free instance hours
# (one always-on service uses ~744 a month):
#   1. this one, chui-reporter: the interface and the agent (the agent runs inside it as a worker thread);
#   2. chui-converter (render.converter.yaml): LibreOffice behind a small authenticated API, so its memory never competes with
#      the agent. The app reaches it over HTTPS with a shared token.
# Keep numInstances at 1: a run is owned by the process that started it, and recovery assumes a single owner.
#
# Free services sleep after ~15 minutes without traffic. An uptime monitor that sends a request to /healthz every 5 minutes
# (HEAD or GET) keeps both awake; /healthz does not touch the database, so the monitor does not keep Neon awake either.
# The region matches the Neon database (eu-west-2, London).
services:
  - type: web
    name: chui-reporter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WITH_LIBREOFFICE         # the converter is a separate service; keep LibreOffice out of this image
        value: "0"
      - key: CHUI_PDF_CONVERTER
        value: remote
      - key: CHUI_CONVERTER_URL       # the converter service's address
        sync: false
      - key: CHUI_CONVERTER_TOKEN     # must equal the converter service's token
        sync: false
      - key: DATABASE_URL             # Neon pooled connection string
        sync: false
      - key: CHUI_ACCESS_PASSWORD     # the shared password the team signs in with
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY        # optional; enables the Anthropic provider / automatic fallback
        sync: false
      - key: TAVILY_API_KEY           # web search for macro data (default provider)
        sync: false
      - key: BRAVE_API_KEY            # web search fallback when Tavily's credit is used up
        sync: false
      - key: ILOVEAPI_PUBLIC_KEY      # optional: hosted Word -> PDF fallback (it does not keep the brand font; see README)
        sync: false
      - key: CHUI_SESSION_SECRET
        generateValue: true
      - key: CHUI_PROVIDER
        value: deepseek
      - key: CHUI_SEARCH_ORDER
        value: tavily,brave
      - key: CHUI_ENV
        value: production
