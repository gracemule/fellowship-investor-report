# Render blueprint for the Chui Ventures reporter.
#
# One web service. The agent runs inside it as a background worker thread, so there is no
# separate worker or cron service to deploy. Keep numInstances at 1: a run is owned by the process
# that started it, and recovery after a restart assumes a single owner.
#
# Pick the region closest to the Neon database (the connection string's host shows its region).
services:
  - type: web
    name: chui-reporter
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE PROFILE. Two limits to know about before relying on it:
    #  * a free service sleeps after ~15 minutes without traffic. A run that is in progress pauses and resumes
    #    from its last step when the service wakes (the first visit, or a pinger hitting /healthz), but the
    #    agent is not "alone" while it is asleep;
    #  * 512 MB of memory. The hosted PDF converter (below) is what keeps the app inside it.
    # PAID FALLBACK (if the font check shows the hosted converter drops the brand font, or to let the agent
    # run unattended): plan: standard, WITH_LIBREOFFICE=1, CHUI_PDF_CONVERTER=libreoffice. Nothing else changes.
    plan: free
    region: oregon              # CHANGE to match the Neon region
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WITH_LIBREOFFICE
        value: "0"
      - key: CHUI_PDF_CONVERTER
        value: iloveapi
      - key: DATABASE_URL           # Neon pooled connection string
        sync: false
      - key: CHUI_ACCESS_PASSWORD   # the shared password the team signs in with
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY      # optional; enables the Anthropic provider / automatic fallback
        sync: false
      - key: ILOVEAPI_PUBLIC_KEY    # hosted Word -> PDF conversion
        sync: false
      - key: TAVILY_API_KEY         # web search for macro data (default provider)
        sync: false
      - key: BRAVE_API_KEY          # web search fallback when Tavily's credit is used up
        sync: false
      - key: CHUI_SESSION_SECRET
        generateValue: true
      - key: CHUI_PROVIDER
        value: deepseek
      - key: CHUI_FALLBACK_PROVIDER # used only if its key is set
        value: anthropic
      - key: CHUI_ENV
        value: production
